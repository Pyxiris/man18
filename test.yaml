version: "2.4"

services:
  odoo:
    extends:
      file: common.yaml
      service: odoo
    env_file:
      - .docker/odoo.env
      - .docker/db-access.env
    environment:
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-test}"
      LIST_DB: "true"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      # To install demo data export DOODBA_WITHOUT_DEMO=false
      WITHOUT_DEMO: "${DOODBA_WITHOUT_DEMO-all}"
      SMTP_PORT: "1025"
      SMTP_SERVER: smtplocal
      # Just in case you use queue_job
      ODOO_QUEUE_JOB_CHANNELS: "root:1"
      PGHOST: man18-18-0-test-db
    restart: unless-stopped
    hostname: "test.manmanufacturing.com"
    depends_on:
      - db
      - smtp
    networks:
      default:
      globalwhitelist_shared:
      inverseproxy_shared:
    labels:
      doodba.domain.main: "test.manmanufacturing.com"
      traefik.enable: "true"
      traefik.domain: "test.manmanufacturing.com"
      traefik.forbiddenCrawlers-0.frontend.headers.customResponseHeaders:
        "X-Robots-Tag:noindex, nofollow"
      traefik.forbiddenCrawlers-0.frontend.rule: Host:test.manmanufacturing.com;Path:/{anything:.*}
      traefik.longpolling-0.frontend.rule: Host:test.manmanufacturing.com;Path:/websocket,/websocket/{anything:.*}
      traefik.longpolling-0.port: 8072
      traefik.alt-1.frontend.redirect.regex: ^(.*)://([^/]+)/(.*)$$
      traefik.alt-1.frontend.redirect.replacement: $$1://test.manmanufacturing.com/$$3
      traefik.alt-1.frontend.rule: Host:www.test.manmanufacturing.com
      traefik.http.middlewares.man18-18-0-test-override-ws-headers.headers.customRequestHeaders.X-Forwarded-Proto: "https"
      traefik.http.services.man18-18-0-test-main.loadbalancer.server.port: 8069
      traefik.http.services.man18-18-0-test-longpolling.loadbalancer.server.port: 8072
      traefik.http.routers.man18-18-0-test-longpolling-0.rule:
        Host(`test.manmanufacturing.com`) && Path(`/websocket`)
      traefik.http.routers.man18-18-0-test-longpolling-0.service:
        man18-18-0-test-longpolling
      traefik.http.routers.man18-18-0-test-longpolling-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-forceSecure, man18-18-0-test-override-ws-headers
      traefik.http.routers.man18-18-0-test-longpolling-0.priority: 10
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.rule:
        Host(`test.manmanufacturing.com`) && Path(`/websocket`)
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.service:
        man18-18-0-test-longpolling
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-forceSecure, man18-18-0-test-override-ws-headers
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.priority: 10
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.tls: "true"
      traefik.http.routers.man18-18-0-test-longpolling-secure-0.tls.certResolver:
        letsencrypt
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-0.rule:
        Host(`test.manmanufacturing.com`) && (PathPrefix(`/`))
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-0.service:
        man18-18-0-test-main
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-buffering, man18-18-0-test-compress, man18-18-0-test-forbid-crawlers, man18-18-0-test-forceSecure
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-0.priority: 10
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.rule:
        Host(`test.manmanufacturing.com`) && (PathPrefix(`/`))
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.service:
        man18-18-0-test-main
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-buffering, man18-18-0-test-compress, man18-18-0-test-forbid-crawlers, man18-18-0-test-forceSecure
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.priority: 10
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.tls: "true"
      traefik.http.routers.man18-18-0-test-forbiddenCrawlers-secure-0.tls.certResolver:
        letsencrypt
      traefik.http.middlewares.man18-18-0-test-redirect-1.redirectRegex.permanent: "true"
      traefik.http.middlewares.man18-18-0-test-redirect-1.redirectRegex.regex: ^(.*)://([^/]+)/(.*)$$
      traefik.http.middlewares.man18-18-0-test-redirect-1.redirectRegex.replacement: $$1://test.manmanufacturing.com/$$3
      traefik.http.routers.man18-18-0-test-redirect-1.rule:
        Host(`www.test.manmanufacturing.com`)
      traefik.http.routers.man18-18-0-test-redirect-1.service:
        man18-18-0-test-main
      traefik.http.routers.man18-18-0-test-redirect-1.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-compress, man18-18-0-test-forceSecure, man18-18-0-test-redirect-1
      traefik.http.routers.man18-18-0-test-redirect-1.priority: 10
      traefik.http.routers.man18-18-0-test-redirect-secure-1.rule:
        Host(`www.test.manmanufacturing.com`)
      traefik.http.routers.man18-18-0-test-redirect-secure-1.service:
        man18-18-0-test-main
      traefik.http.routers.man18-18-0-test-redirect-secure-1.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-compress, man18-18-0-test-forceSecure, man18-18-0-test-redirect-1
      traefik.http.routers.man18-18-0-test-redirect-secure-1.priority: 10
      traefik.http.routers.man18-18-0-test-redirect-secure-1.tls: "true"
      traefik.http.routers.man18-18-0-test-redirect-secure-1.tls.certResolver:
        letsencrypt
    command:
      - odoo
      - --workers=3
      - --max-cron-threads=1

  db:
    extends:
      file: common.yaml
      service: db
    environment:
      DB_HOST: man18-18-0-test-db
    env_file:
      - .docker/db-creation.env
    networks:
      default:
        aliases:
            - "man18-18-0-test-db"
    restart: unless-stopped

  smtp:
    extends:
      file: common.yaml
      service: smtpfake
    restart: unless-stopped
    networks:
      default:
        aliases:
          - smtplocal
      inverseproxy_shared:
    labels:
      doodba.domain.main: "test.manmanufacturing.com"
      traefik.docker.network: "inverseproxy_shared"
      traefik.enable: "true"
      traefik.frontend.passHostHeader: "true"
      traefik.mailhog-0.frontend.rule: Host:test.manmanufacturing.com;PathPrefixStrip:/smtpfake/
      traefik.mailhog-0.port: 8025
      # Mailhog service
      traefik.http.middlewares.man18-18-0-test-mailhog-stripprefix.stripPrefix.prefixes: /smtpfake/
      traefik.http.services.man18-18-0-test-mailhog.loadbalancer.server.port: 8025
      traefik.http.middlewares.man18-18-0-test-buffering.buffering.retryExpression:
        IsNetworkError() && Attempts() < 5
      traefik.http.middlewares.man18-18-0-test-compress.compress: "true"
      ? traefik.http.middlewares.man18-18-0-test-forbid-crawlers.headers.customResponseHeaders.X-Robots-Tag
      : "noindex, nofollow"
      traefik.http.middlewares.man18-18-0-test-addSTS.headers.forceSTSHeader: "true"
      traefik.http.middlewares.man18-18-0-test-forceSecure.redirectScheme.scheme: https
      traefik.http.middlewares.man18-18-0-test-forceSecure.redirectScheme.permanent: "true"
      traefik.http.routers.man18-18-0-test-mailhog-0.rule:
        Host(`test.manmanufacturing.com`) && PathPrefix(`/smtpfake/`)
      traefik.http.routers.man18-18-0-test-mailhog-0.service:
        man18-18-0-test-mailhog
      traefik.http.routers.man18-18-0-test-mailhog-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-buffering, man18-18-0-test-compress, man18-18-0-test-forbid-crawlers, man18-18-0-test-forceSecure, man18-18-0-test-mailhog-stripprefix
      traefik.http.routers.man18-18-0-test-mailhog-secure-0.rule:
        Host(`test.manmanufacturing.com`) && PathPrefix(`/smtpfake/`)
      traefik.http.routers.man18-18-0-test-mailhog-secure-0.service:
        man18-18-0-test-mailhog
      traefik.http.routers.man18-18-0-test-mailhog-secure-0.middlewares:
        man18-18-0-test-addSTS, man18-18-0-test-buffering, man18-18-0-test-compress, man18-18-0-test-forbid-crawlers, man18-18-0-test-forceSecure, man18-18-0-test-mailhog-stripprefix
      traefik.http.routers.man18-18-0-test-mailhog-secure-0.tls: "true"
      traefik.http.routers.man18-18-0-test-mailhog-secure-0.tls.certResolver:
        letsencrypt
    volumes:
      - "smtpconf:/etc/mailhog:ro,z"
    entrypoint: [sh, -c]
    command:
      - test -r /etc/mailhog/auth && export MH_AUTH_FILE=/etc/mailhog/auth; exec MailHog

networks:
  default:
    internal: ${DOODBA_NETWORK_INTERNAL-true}
    driver_opts:
      encrypted: 1

  globalwhitelist_shared:
    external: true

  inverseproxy_shared:
    external: true

volumes:
  filestore:
  db:
  smtpconf:
