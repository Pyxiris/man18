services:
  odoo:
    image: ghcr.io/pyxiris/man18:19.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "17"
        ODOO_VERSION: "19.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "notifications@manmanufacturing.com"
      PGDATABASE: &dbname prod
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
    tty: true
    volumes:
      - filestore:/var/lib/odoo
      - mailgate:/opt/odoo/custom/src/odoo/addons/mail/static/scripts:rw,z
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:17-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      PGDATA: "/var/lib/postgresql/data"
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data

  smtpfake:
    image: docker.io/axllent/mailpit
    environment:
      MP_SMTP_RELAY_ALL: "true"
      MP_SMTP_RELAY_ALLOW_INSECURE: "true"
      MP_SMTP_RELAY_PRESERVE_MESSAGE_IDS: "true"

  mailserver_fake:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mailserver.manmanufacturing.com
    environment:
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      ENABLE_AMAVIS: 0
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_SRS: 0
      ENABLE_QUOTAS: 0
      MAILGATE_SMTP_PORT: "13525"
      ODOO_RECEIVING_DOMAINS: manmanufacturing.com
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /tmp/docker-mailserver
        echo "$${MAILBOX_USER}@$${MAILBOX_DOMAIN}|{PLAIN}$${ADMIN_PASSWORD}" \
          > /tmp/docker-mailserver/postfix-accounts.cf
        exec /usr/bin/dumb-init -- supervisord -c /etc/supervisor/supervisord.conf
    volumes:
      - ./mail-testing-config/docker-mailserver/user-patches.sh:/tmp/docker-mailserver/user-patches.sh:ro
      - mailgate:/tmp/mailgate:ro,z

  email_client_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cypht
      POSTGRES_USER: cypht
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d cypht -U cypht"]
      interval: 5s
      timeout: 5s
      retries: 5

  email_client:
    image: docker.io/cypht/cypht:latest
    environment:
      AUTH_TYPE: DB
      SESSION_TYPE: DB
      USER_CONFIG_TYPE: DB
      DB_CONNECTION_TYPE: host
      DB_DRIVER: pgsql
      DB_NAME: cypht
      DB_USER: cypht
      IMAP_AUTH_PORT: "143"
      IMAP_AUTH_TLS: "false"
      DEFAULT_SMTP_PORT: "13525"
      DEFAULT_SMTP_TLS: "false"
      DEFAULT_SMTP_NO_AUTH: "true"
      AUTO_CREATE_PROFILE: "true"
      ENABLE_REDIS: "false"
      ENABLE_MEMCACHED: "false"
      DEFAULT_SETTING_SMTP_COMPOSE_TYPE: "1"
      DEFAULT_SETTING_INLINE_MESSAGE: "true"
      DEFAULT_SETTING_THEME: slate
      CYPHT_MODULES: >-
        core,contacts,local_contacts,imap,smtp,account,idle_timer,themes,
        profiles,imap_folders,tags,autocreate_profile
    volumes:
      - ./mail-testing-config/cypht/modules/autocreate_profile:/usr/local/share/cypht/modules/autocreate_profile:ro

  smtpreal:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: "smtp.manmanufacturing.com"
    stop_grace_period: 1m
    volumes:
      - mailconfig:/tmp/docker-mailserver
      - maildata:/var/mail
      - maillogs:/var/log/mail
      - maillogssupervisord:/var/log/supervisor
      - mailstate:/var/mail-state
      - mailgate:/tmp/mailgate:ro,z
    cap_add:
      - SYS_PTRACE
    environment:
      DEFAULT_RELAY_HOST: "[mail.smtp2go.com]:2525"
      DMS_DEBUG: 0
      ENABLE_SRS: 1
      ONE_DIR: 1
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      POSTFIX_MESSAGE_SIZE_LIMIT: 52428800 # 50 MiB
      RELAY_HOST: "mail.smtp2go.com"
      RELAY_PORT: "2525"
      RELAY_USER: "manmanufacturing.com"
      SMTP_ONLY: 1
      SRS_DOMAINNAME: "manmanufacturing.com"
      SRS_EXCLUDE_DOMAINS: "manmanufacturing.com"
      SRS_SENDER_CLASSES: envelope_sender,header_sender

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres-s3:latest
    hostname: backup.manmanufacturing.com
    init: true
    environment:
      DB_VERSION: "17"
      DBS_TO_INCLUDE: "^prod"
      DST: "boto3+s3://man18-backup"
      EMAIL_FROM: "backups@manmanufacturing.com"
      EMAIL_TO: "admin@manmanufacturing.com"
      PGDATABASE: *dbname
      PGUSER: *dbuser
      SMTP_HOST: smtplocal
      TZ: "America/Detroit"
    volumes:
      - backup_cache:/root
      - filestore:/mnt/backup/src/odoo

volumes:
  mailgate:
