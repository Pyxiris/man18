version: "2.4"

services:
  odoo:
    image: ghcr.io/pyxiris/man18:19.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "17"
        ODOO_VERSION: "19.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "notifications@manmanufacturing.com"
      PGDATABASE: &dbname prod
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
    tty: true
    volumes:
      - filestore:/var/lib/odoo:z
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:17-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data:z

  smtpfake:
    image: docker.io/axllent/mailpit
    environment:
      MP_SMTP_RELAY_ALL: "true"
      MP_SMTP_RELAY_ALLOW_INSECURE: "true"
      MP_SMTP_RELAY_PRESERVE_MESSAGE_IDS: "true"

  mailserver_fake:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: mailserver.manmanufacturing.com
    environment:
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      ENABLE_AMAVIS: 0
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_SRS: 0
      ENABLE_QUOTAS: 0
      ODOO_RECEIVING_DOMAINS: manmanufacturing.com
    entrypoint:
      - bash
      - -c
      - |
        cp -r /tmp/docker-mailserver-staging/ /tmp/docker-mailserver
        chmod 755 /tmp/docker-mailserver/create-config.sh
        /tmp/docker-mailserver/create-config.sh
        exec supervisord -c /etc/supervisor/supervisord.conf
    volumes:
      - ./mail-testing-config/docker-mailserver/:/tmp/docker-mailserver-staging/:ro
      - ./odoo/custom/src/odoo/addons/mail/static/scripts/odoo-mailgate.py:/tmp/odoo-mailgate.py:ro

  email_client_fake:
    image: roundcube/roundcubemail
    environment:
      ROUNDCUBEMAIL_COMPOSER_PLUGINS: "texxasrulez/persistent_login"
      ROUNDCUBEMAIL_PLUGINS: "show_additional_headers,persistent_login,autocreate_identity"
    depends_on:
      - mailserver
    volumes:
      - ./mail-testing-config/roundcube/roundcube_user_settings.inc.php:/var/roundcube/config/config.inc.php:ro
      - ./mail-testing-config/roundcube/plugins/autocreate_identity:/var/www/html/plugins/autocreate_identity

  smtpreal:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: "smtp.manmanufacturing.com"
    stop_grace_period: 1m
    volumes:
      - mailconfig:/tmp/docker-mailserver:z
      - maildata:/var/mail:z
      - maillogs:/var/log/mail:z
      - maillogssupervisord:/var/log/supervisor:z
      - mailstate:/var/mail-state:z
    cap_add:
      - SYS_PTRACE
    environment:
      DEFAULT_RELAY_HOST: "[mail.smtp2go.com]:2525"
      DMS_DEBUG: 0
      ENABLE_SRS: 1
      ONE_DIR: 1
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      POSTFIX_MESSAGE_SIZE_LIMIT: 52428800 # 50 MiB
      RELAY_HOST: "mail.smtp2go.com"
      RELAY_PORT: "2525"
      RELAY_USER: "manmanufacturing.com"
      SMTP_ONLY: 1
      SRS_DOMAINNAME: "manmanufacturing.com"
      SRS_EXCLUDE_DOMAINS: "manmanufacturing.com"
      SRS_SENDER_CLASSES: envelope_sender,header_sender

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres-s3:latest
    hostname: backup.manmanufacturing.com
    init: true
    environment:
      DB_VERSION: "17"
      DBS_TO_INCLUDE: "^prod"
      DST: "boto3+s3://man18-backup"
      EMAIL_FROM: "backups@manmanufacturing.com"
      EMAIL_TO: "admin@manmanufacturing.com"
      PGDATABASE: *dbname
      PGUSER: *dbuser
      SMTP_HOST: smtplocal
      TZ: "America/Detroit"
    volumes:
      - backup_cache:/root:z
      - filestore:/mnt/backup/src/odoo:z
