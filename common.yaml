services:
  odoo:
    image: ghcr.io/pyxiris/man18:19.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "17"
        ODOO_VERSION: "19.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "notifications@manmanufacturing.com"
      PGDATABASE: &dbname prod
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
    tty: true
    volumes:
      - filestore:/var/lib/odoo
      - mailgate:/opt/odoo/custom/src/odoo/addons/mail/static/scripts:rw,z
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:17-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      PGDATA: "/var/lib/postgresql/data"
      CONF_EXTRA: |
        work_mem = 512MB
    volumes:
      - db:/var/lib/postgresql/data

  smtpfake:
    image: docker.io/axllent/mailpit
    hostname: mailpit.mail.test
    environment:
      MP_SMTP_RELAY_ALL: "true"
      MP_SMTP_RELAY_ALLOW_INSECURE: "true"
      MP_SMTP_RELAY_PRESERVE_MESSAGE_IDS: "true"

  stalwart_fake:
    build:
      context: ./mail-testing-config/stalwart
    hostname: mail.mail.test
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD:-admin}"
      ADMIN_PASSWORD: "${STALWART_MAILBOX_PASSWORD:-develmail}"
      ODOO_RECEIVING_DOMAINS: manmanufacturing.com
    volumes:
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
    depends_on:
      - mailgate_hook

  mailgate_hook:
    build:
      context: ./mail-testing-config/mailgate-hook
    environment:
      ODOO_RECEIVING_DOMAINS: manmanufacturing.com
      ODOO_HOST: odoo
      ODOO_PORT: "8069"
    volumes:
      - mailgate:/mailgate:ro,z
    networks:
      default:
        aliases:
          - mailgate-hook

  webmail_jmap_proxy:
    image: docker.io/caddy:2-alpine
    volumes:
      - ./mail-testing-config/webmail-proxy/Caddyfile:/etc/caddy/Caddyfile:ro

  bulwark_webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      STALWART_FEATURES: "true"
      SETTINGS_SYNC_ENABLED: "true"
      LOG_FORMAT: text
      LOG_LEVEL: info
    volumes:
      - bulwark_admin:/app/data/admin
      - ./mail-testing-config/bulwark/policy.json:/app/data/admin/policy.json:ro
      - bulwark_settings:/app/data/settings

  smtpreal:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: "smtp.manmanufacturing.com"
    stop_grace_period: 1m
    volumes:
      - mailconfig:/tmp/docker-mailserver
      - maildata:/var/mail
      - maillogs:/var/log/mail
      - maillogssupervisord:/var/log/supervisor
      - mailstate:/var/mail-state
      - mailgate:/tmp/mailgate:ro,z
    cap_add:
      - SYS_PTRACE
    environment:
      DEFAULT_RELAY_HOST: "[mail.smtp2go.com]:2525"
      DMS_DEBUG: 0
      ENABLE_SRS: 1
      ONE_DIR: 1
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      POSTFIX_MESSAGE_SIZE_LIMIT: 52428800 # 50 MiB
      RELAY_HOST: "mail.smtp2go.com"
      RELAY_PORT: "2525"
      RELAY_USER: "manmanufacturing.com"
      SMTP_ONLY: 1
      SRS_DOMAINNAME: "manmanufacturing.com"
      SRS_EXCLUDE_DOMAINS: "manmanufacturing.com"
      SRS_SENDER_CLASSES: envelope_sender,header_sender

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres-s3:latest
    hostname: backup.manmanufacturing.com
    init: true
    environment:
      DB_VERSION: "17"
      DBS_TO_INCLUDE: "^prod"
      DST: "boto3+s3://man18-backup"
      EMAIL_FROM: "backups@manmanufacturing.com"
      EMAIL_TO: "admin@manmanufacturing.com"
      PGDATABASE: *dbname
      PGUSER: *dbuser
      SMTP_HOST: smtplocal
      TZ: "America/Detroit"
    volumes:
      - backup_cache:/root
      - filestore:/mnt/backup/src/odoo

volumes:
  stalwart_etc:
  stalwart_data:
  bulwark_admin:
  bulwark_settings:
  mailgate:
